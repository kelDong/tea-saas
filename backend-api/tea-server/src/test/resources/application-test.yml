# 集成测试 profile：独立测试库 tea_saas_test（建库/建表由 IntegrationTestBase 从 01_schema.sql 重建）
# 前置：本机 Docker tea-mysql(3307)/tea-redis(6379)/minio(9000) 运行中（与本地开发共用容器，库隔离）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/tea_saas_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

tea:
  job:
    # 测试期停用定时调度：防超时取消/回调重试任务干扰并发用例的订单与流水状态
    enabled: false
  pay:
    mock: true

logging:
  level:
    com.teasaas: warn
    org.springframework: warn
