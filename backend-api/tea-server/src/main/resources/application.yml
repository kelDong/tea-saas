# 茶饮 SaaS 后端配置（本地默认指向 Docker 容器 tea-mysql/tea-redis；生产用环境变量覆盖，密钥禁止入库）
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tea-saas
  datasource:
    # tea-mysql 容器映射宿主 3307（3306 被本机 phpStudy MySQL5.7 占用）
    # characterEncoding 用 Java 字符集名 UTF-8（mysql-connector-j 9.x 不认 utf8mb4，会 Unsupported characterEncoding 建连失败；UTF-8 会自动协商 utf8mb4）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:tea_saas}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  token-style: uuid

# 订单/支付/C端会话配置（P1-5 超时未付 15 分钟自动取消；mock 网关待 t100011 资质下发后置 false）
tea:
  order:
    pay-timeout-minutes: 15
  pay:
    mock: true
  app:
    # C 端会员会话 token 有效期（天），正式运营可与 Sa-Token 会话时长对齐调整
    member-token-ttl-days: 7

# 接口文档
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.teasaas: debug
