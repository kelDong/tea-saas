# tea-saas 反向代理配置（构建时打进 web 镜像，挂载为 /etc/nginx/conf.d/default.conf）
# 职责：SPA 静态资源 + /api 反代 + /ws WebSocket + /oss 对象存储公开读
# 证书迁移 HTTPS 时放开文件末尾的 443 注释块

# WebSocket 升级头：Connection 必须按 Upgrade 头有无映射，写死 upgrade 会破坏普通请求
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 与后端 multipart 上限对齐（application.yml max-request-size 12MB）
    client_max_body_size 12m;

    # ---- gzip（vite 产物 js/css/json 收益明显） ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- SPA ----
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API（前端 axios 走相对路径 /api/v1） ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket（/ws/orders，token 经 query 传入） ----
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接空闲容忍（30s 心跳，网络抖动时不至于立刻断）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- MinIO 公开读（尾斜杠去掉 /oss 前缀，正好落在桶路径上） ----
    # 仅匿名 GET 可达（桶策略 anonymous download）；SDK 签名流量走容器内网直连不经此路径
    location /oss/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }
}

